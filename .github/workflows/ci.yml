name: CI

on:
  push:
    branches: [ main, master, "feature/**", "release/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for deterministic Source Link

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/STMSharp/STMSharp.sln

      - name: Build
        run: dotnet build src/STMSharp/STMSharp.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test src/STMSharp/STMSharp.sln
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: >
          dotnet pack src/STMSharp/STMSharp.csproj
          --configuration Release
          --output ${{ github.workspace }}/artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/artifacts/*.*nupkg
